# ragops test -f haystack.yaml   (run from examples/frameworks)
project: frameworks-haystack
server: http://localhost:8000
pipeline:
  kind: python
  callable: haystack_rag.py:answer
config:              # the knobs haystack_rag.py reads; `ragops doctor -f haystack.yaml` tunes them
  chunk_size: 120
  chunk_overlap: 20
  top_k: 3
  max_tokens: 8192
dataset: ../doctor/tests.jsonl
corpus: ../doctor/docs/
chunk_words: 40
thresholds:
  max_failure_rate: 0.25
