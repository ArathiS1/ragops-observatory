# ragops test -f llamaindex.yaml   (run from examples/frameworks)
project: frameworks-llamaindex
server: http://localhost:8000
pipeline:
  kind: python
  callable: llamaindex_rag.py:answer
config:              # the knobs llamaindex_rag.py reads; `ragops doctor -f llamaindex.yaml` tunes them
  chunk_size: 256
  chunk_overlap: 20
  top_k: 3
  max_tokens: 8192
dataset: ../doctor/tests.jsonl
corpus: ../doctor/docs/
chunk_words: 40
thresholds:
  max_failure_rate: 0.25
