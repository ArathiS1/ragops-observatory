name: Release
# Push a tag like v0.10.0 to publish: GitHub release (notes from CHANGELOG.md), PyPI package with the dashboard
# built in, Docker image on GHCR, and (optionally) the TypeScript SDK on npm. See docs/releasing.md.
on:
  push: { tags: ["v*"] }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: build the web UI into the package
        run: cd web && npm ci && npm run build && rm -rf ../ragops/server/ui && cp -r dist ../ragops/server/ui
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: check the tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - run: pip install build twine && python -m build && twine check dist/*
      - name: the wheel must contain the dashboard
        run: unzip -l dist/*.whl | grep -q "ragops/server/ui/index.html"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/project/ragops-observatory/" }
    permissions: { id-token: write }          # PyPI trusted publishing: no API token stored in GitHub
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { skip-existing: true }

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v"($| )"{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with: { body_path: notes.md, files: "dist/*" }

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions: { packages: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/arathis1/ragops-observatory:${{ github.ref_name }}
            ghcr.io/arathis1/ragops-observatory:latest

  npm:
    # optional: set the repository variable PUBLISH_NPM=true and the secret NPM_TOKEN to publish @ragops/sdk
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - working-directory: sdk-ts
        run: npm ci && npm run build && npm publish --access public
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
