{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: {{ .Release.Name }} }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - { path: /v1, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { number: 8000 } } } }
          - { path: /otlp, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { number: 8000 } } } }
          - { path: /health, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { number: 8000 } } } }
          - { path: /ui, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { number: 8000 } } } }
          {{- if .Values.dashboard.enabled }}
          - { path: /streamlit, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-dashboard, port: { number: 8501 } } } }
          {{- end }}
{{- end }}
