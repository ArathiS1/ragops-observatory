apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "ragops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector: { matchLabels: { app: {{ .Release.Name }}-api } }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-api }
      annotations: { checksum/values: {{ toJson .Values | sha256sum | trunc 16 | quote }} }
    spec:
      {{- include "ragops.podSpecCommon" . | nindent 6 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["ragops", "serve", "--host", "0.0.0.0", "--port", "8000"]
          env: {{- include "ragops.env" . | nindent 12 }}
          ports: [{ containerPort: 8000, name: http }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 30, failureThreshold: 5 }
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "ragops.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-api }
  ports: [{ port: 8000, targetPort: http, name: http }]
