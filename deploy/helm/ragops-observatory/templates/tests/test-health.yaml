apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-health
  labels: {{- include "ragops.labels" . | nindent 4 }}
  annotations: { helm.sh/hook: test, helm.sh/hook-delete-policy: hook-succeeded }
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      command: ["python", "-c", "import urllib.request,json; r=json.load(urllib.request.urlopen('http://{{ .Release.Name }}-api:8000/health')); assert r['status']=='ok', r; print(r)"]
